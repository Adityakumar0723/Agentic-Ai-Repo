openapi: 3.0.3
info:
  title: Agentic AI — Unified Agent Backend
  description: >
    A Node.js/Express backend hosting multiple agents: Wikipedia (search, summary, full article
    content, random articles), GlobalWire (30,000+ RSS news sources + Reddit), and Sarvam AI.


    SARVAM AI AGENT — WHEN TO CALL IT: Call the Sarvam AI endpoints (`/api/search/search`,
    `/api/search/news`, `/api/search/answer`) for ANY user request that needs a direct answer,
    an explanation, current/real-time information, a definition, a comparison, "what is", "who is",
    "latest", "news about", "how does X work", or any open-ended question that isn't specifically
    about a Wikipedia article or a GlobalWire news category. Sarvam AI is the general-purpose
    answer engine of this backend and should be the DEFAULT choice whenever the user's intent is
    simply "answer my question" rather than "give me a Wikipedia page" or "give me a news feed".

    Every Sarvam AI endpoint returns a ready-to-read, synthesized natural-language `answer` field
    generated by the Sarvam AI chat model — never raw, unprocessed search results alone. `/search`
    and `/news` additionally ground that answer in live web/news results fetched via Tavily (also
    returned, for citation), and gracefully fall back to Sarvam AI's own knowledge if live search
    is temporarily unavailable, so these endpoints ALWAYS return a usable answer and never a bare
    error for a valid query. Prefer `/api/search/search` as the default endpoint for a general
    question; use `/api/search/news` when the user explicitly wants recent/breaking news; use
    `/api/search/answer` only when a quick direct answer is needed with no live grounding required.
  version: 4.0.0
servers:
  - url: https://serverless.on-demand.io/apps/agentic-ai
    description: Live deployed server
  - url: http://localhost:5000
    description: Local development server

paths:
  /:
    get:
      summary: API info / health check
      operationId: getApiInfo
      responses:
        "200":
          description: API metadata and available endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Wikipedia Agent API
                  status:
                    type: string
                    example: running
                  endpoints:
                    type: object
                    additionalProperties:
                      type: string

  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/wikipedia/search:
    get:
      summary: Search Wikipedia articles
      operationId: searchArticles
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
          example: Artificial Intelligence
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResult"
        "400":
          description: Missing required query param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/wikipedia/summary/{title}:
    get:
      summary: Get a short summary of a Wikipedia article
      operationId: getSummary
      parameters:
        - name: title
          in: path
          required: true
          description: Wikipedia article title
          schema:
            type: string
          example: India
      responses:
        "200":
          description: Article summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "404":
          description: Article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/wikipedia/page/{title}:
    get:
      summary: Get the full content of a Wikipedia article
      operationId: getFullPage
      parameters:
        - name: title
          in: path
          required: true
          description: Wikipedia article title
          schema:
            type: string
          example: India
      responses:
        "200":
          description: Full article content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "404":
          description: Article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/wikipedia/random:
    get:
      summary: Get the full content of a random Wikipedia article
      operationId: getRandomArticle
      responses:
        "200":
          description: Full content of a randomly selected article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"

  /api/search/search:
    get:
      summary: Answer any general question using Sarvam AI, grounded in live web search (DEFAULT endpoint for user questions)
      description: >
        THE DEFAULT ENDPOINT for answering a user's question. Call this whenever the user asks
        anything that needs an explanation, a fact, a definition, a comparison, or up-to-date
        information — "what is X", "who is X", "latest on X", "how does X work", etc. Sarvam AI
        generates the final natural-language `answer`, grounded in live web results fetched via
        Tavily (also returned under `results` for citation). If live search is unavailable,
        Sarvam AI still answers from its own knowledge (`groundedInLiveResults: false`) instead of
        failing, so this endpoint always returns a usable answer for a valid query.
      operationId: webSearch
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
          example: latest AI research breakthroughs
        - name: maxResults
          in: query
          required: false
          description: Number of results to return (max 20)
          schema:
            type: integer
            default: 10
        - name: depth
          in: query
          required: false
          description: Search depth/thoroughness
          schema:
            type: string
            enum: [basic, advanced]
            default: basic
        - name: timeRange
          in: query
          required: false
          description: Restrict results by recency
          schema:
            type: string
            enum: [day, week, month, year]
      responses:
        "200":
          description: Web search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSearchResponse"
        "400":
          description: Missing required query param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/search/news:
    get:
      summary: Answer a news/current-events question using Sarvam AI, grounded in live news search
      description: >
        Call this instead of `/api/search/search` when the user explicitly wants recent or
        breaking news, or asks "what's happening with X", "latest news about X", "today's X news".
        Sarvam AI generates the final natural-language `answer`, grounded in live news results
        fetched via Tavily (also returned under `results` for citation). If live search is
        unavailable, Sarvam AI still answers from its own knowledge (`groundedInLiveResults: false`)
        instead of failing.
      operationId: newsSearch
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
          example: stock market today
        - name: maxResults
          in: query
          required: false
          description: Number of results to return (max 20)
          schema:
            type: integer
            default: 10
        - name: timeRange
          in: query
          required: false
          description: Restrict results by recency
          schema:
            type: string
            enum: [day, week, month, year]
            default: week
      responses:
        "200":
          description: News search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsSearchResponse"
        "400":
          description: Missing required query param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/search/answer:
    get:
      summary: Quick direct answer from Sarvam AI with no live search grounding
      description: >
        A lightweight, fast endpoint that answers directly from Sarvam AI's own knowledge, with
        no live web/news lookup. Use this only when the user explicitly wants a quick answer and
        current/real-time grounding is not needed (e.g. general knowledge, reasoning, explanation).
        For anything that benefits from up-to-date information, prefer `/api/search/search` or
        `/api/search/news` instead, since those also ground the answer in live results.
      operationId: aiAnswer
      parameters:
        - name: q
          in: query
          required: true
          description: Natural-language question to answer
          schema:
            type: string
          example: What is retrieval augmented generation?
      responses:
        "200":
          description: AI-generated answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnswerResponse"
        "400":
          description: Missing required query param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Sarvam AI request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    SearchResult:
      type: object
      properties:
        title:
          type: string
        snippet:
          type: string
        pageId:
          type: integer
        wordCount:
          type: integer
        timestamp:
          type: string
          format: date-time

    Summary:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        extract:
          type: string
        thumbnail:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        lang:
          type: string

    Page:
      type: object
      properties:
        pageId:
          type: integer
        title:
          type: string
        url:
          type: string
        content:
          type: string
        categories:
          type: array
          items:
            type: string
        thumbnail:
          type: string
          nullable: true

    Error:
      type: object
      properties:
        error:
          type: string

    WebResult:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        content:
          type: string
        score:
          type: number
          nullable: true
        publishedDate:
          type: string
          nullable: true

    WebSearchResponse:
      type: object
      properties:
        query:
          type: string
        answer:
          type: string
          nullable: true
          description: Sarvam AI's synthesized answer, grounded in the live search results below
        results:
          type: array
          items:
            $ref: "#/components/schemas/WebResult"
        groundedInLiveResults:
          type: boolean
          description: False if live search was unavailable and Sarvam AI answered from its own knowledge instead

    NewsSearchResponse:
      type: object
      properties:
        query:
          type: string
        answer:
          type: string
          nullable: true
          description: Sarvam AI's synthesized answer, grounded in the live news results below
        results:
          type: array
          items:
            $ref: "#/components/schemas/WebResult"
        groundedInLiveResults:
          type: boolean

    AiAnswerResponse:
      type: object
      properties:
        query:
          type: string
        answer:
          type: string
          nullable: true
          description: AI-generated answer from Sarvam AI's chat completion model
        model:
          type: string
          nullable: true
        usage:
          type: object
          nullable: true
          description: Token usage reported by Sarvam AI
