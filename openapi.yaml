openapi: 3.0.3
info:
  title: Agentic AI — Unified Agent Backend
  description: A Node.js/Express backend hosting multiple agents — Wikipedia (search, summary, full article content, random articles), GlobalWire (30,000+ RSS news sources + Reddit), and Search (live web search, news search, and AI-generated answers powered by the Tavily Search API).
  version: 3.0.0
servers:
  - url: https://serverless.on-demand.io/apps/agentic-ai
    description: Live deployed server
  - url: http://localhost:5000
    description: Local development server

paths:
  /:
    get:
      summary: API info / health check
      operationId: getApiInfo
      responses:
        "200":
          description: API metadata and available endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Wikipedia Agent API
                  status:
                    type: string
                    example: running
                  endpoints:
                    type: object
                    additionalProperties:
                      type: string

  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/wikipedia/search:
    get:
      summary: Search Wikipedia articles
      operationId: searchArticles
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
          example: Artificial Intelligence
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResult"
        "400":
          description: Missing required query param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/wikipedia/summary/{title}:
    get:
      summary: Get a short summary of a Wikipedia article
      operationId: getSummary
      parameters:
        - name: title
          in: path
          required: true
          description: Wikipedia article title
          schema:
            type: string
          example: India
      responses:
        "200":
          description: Article summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "404":
          description: Article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/wikipedia/page/{title}:
    get:
      summary: Get the full content of a Wikipedia article
      operationId: getFullPage
      parameters:
        - name: title
          in: path
          required: true
          description: Wikipedia article title
          schema:
            type: string
          example: India
      responses:
        "200":
          description: Full article content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "404":
          description: Article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/wikipedia/random:
    get:
      summary: Get the full content of a random Wikipedia article
      operationId: getRandomArticle
      responses:
        "200":
          description: Full content of a randomly selected article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"

  /api/search/search:
    get:
      summary: Live web search via the Tavily Search API
      operationId: webSearch
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
          example: latest AI research breakthroughs
        - name: maxResults
          in: query
          required: false
          description: Number of results to return (max 20)
          schema:
            type: integer
            default: 10
        - name: depth
          in: query
          required: false
          description: Search depth/thoroughness
          schema:
            type: string
            enum: [basic, advanced]
            default: basic
        - name: timeRange
          in: query
          required: false
          description: Restrict results by recency
          schema:
            type: string
            enum: [day, week, month, year]
      responses:
        "200":
          description: Web search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSearchResponse"
        "400":
          description: Missing required query param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/search/news:
    get:
      summary: Search live news via the Tavily Search API
      operationId: newsSearch
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
          example: stock market today
        - name: maxResults
          in: query
          required: false
          description: Number of results to return (max 20)
          schema:
            type: integer
            default: 10
        - name: timeRange
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month, year]
            default: week
      responses:
        "200":
          description: News search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsSearchResponse"
        "400":
          description: Missing required query param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/search/answer:
    get:
      summary: Get an AI-generated answer for a query, synthesized from live web results
      operationId: aiAnswer
      parameters:
        - name: q
          in: query
          required: true
          description: Natural-language question to answer
          schema:
            type: string
          example: What is retrieval augmented generation?
      responses:
        "200":
          description: AI-generated answer with cited sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnswerResponse"
        "400":
          description: Missing required query param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No AI summary available for this query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    SearchResult:
      type: object
      properties:
        title:
          type: string
        snippet:
          type: string
        pageId:
          type: integer
        wordCount:
          type: integer
        timestamp:
          type: string
          format: date-time

    Summary:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        extract:
          type: string
        thumbnail:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        lang:
          type: string

    Page:
      type: object
      properties:
        pageId:
          type: integer
        title:
          type: string
        url:
          type: string
        content:
          type: string
        categories:
          type: array
          items:
            type: string
        thumbnail:
          type: string
          nullable: true

    Error:
      type: object
      properties:
        error:
          type: string

    WebResult:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        content:
          type: string
        score:
          type: number
          nullable: true
        publishedDate:
          type: string
          nullable: true

    WebSearchResponse:
      type: object
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/WebResult"
        responseTime:
          type: number
          nullable: true

    NewsSearchResponse:
      type: object
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/WebResult"

    AiAnswerSource:
      type: object
      properties:
        title:
          type: string
          nullable: true
        url:
          type: string
        content:
          type: string
          nullable: true

    AiAnswerResponse:
      type: object
      properties:
        query:
          type: string
        answer:
          type: string
          nullable: true
          description: AI-generated answer synthesized from live web results
        sources:
          type: array
          items:
            $ref: "#/components/schemas/AiAnswerSource"
        responseTime:
          type: number
          nullable: true
