openapi: 3.0.3
info:
  title: Agentic AI — Unified Agent Backend
  description: >-
    Agentic AI is the most powerful unified knowledge backend on the planet —
    combining THREE world-class agents into one API. Each agent has its own
    dedicated OpenAPI schema for plugin integration:


    1. WIKIPEDIA AGENT (wikipedia-agent/openapi.yaml)
       → 60M+ articles from the world's largest encyclopedia
       → Endpoints: /api/wikipedia/search, /api/wikipedia/summary, /api/wikipedia/page, /api/wikipedia/random

    2. GLOBALWIRE AGENT (news-agent/openapi.yaml)
       → 270,000+ live RSS news feeds across 100+ categories — Reddit, Medium, Dev.to, Hashnode, YouTube, arXiv, podcasts, newsletters, tech blogs, Substack, Tumblr, Flipboard, WordPress, Google News (80+ countries), StackExchange, real newspapers, company blogs, university news, government feeds & more
       → Endpoints: /api/news/sources, /api/news/categories, /api/news/feed, /api/news/search, etc.

    3. SARVAM AI AGENT (sarvam-agent/openapi.yaml)
       → AI-powered web search & answers via Tavily + Sarvam AI
       → Endpoints: /api/search/search, /api/search/news, /api/search/answer


    For plugin/agent integration, use each agent's individual OpenAPI schema.
    This unified schema is for reference and health checks only.
  version: 5.0.0
servers:
  - url: https://serverless.on-demand.io/apps/agentic-ai
    description: Live deployed server
  - url: http://localhost:5000
    description: Local development server

paths:
  /:
    get:
      summary: API info / health check — shows all 3 agents and their endpoints
      operationId: getApiInfo
      responses:
        "200":
          description: API metadata listing all agents and available endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Agentic AI — Unified Agent Backend
                  status:
                    type: string
                    example: running
                  agents:
                    type: object
                    additionalProperties:
                      type: object

  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
